<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 800"
     width="100%"
     role="img">

  <defs>

    <radialGradient id="bg">
      <stop offset="0%" stop-color="#141D32"/>
      <stop offset="60%" stop-color="#090E19"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19243B"/>
      <stop offset="100%" stop-color="#0A0F19"/>
    </linearGradient>

    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="14"
                    flood-color="#000000" flood-opacity="0.6"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="800"
        rx="30"
        fill="url(#bg)"/>

  <!-- Header -->
  <text x="600" y="55"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31"
        font-weight="700"
        fill="#F8FAFC">
    ENGINEERING MINDSET
  </text>

  <text x="600" y="84"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#94A3B8">
    Principles behind how I approach software engineering
  </text>

  <rect x="390" y="105"
        width="420" height="3"
        rx="2"
        fill="url(#rgb)"
        filter="url(#glow)"/>

  <!-- Connection lines -->
  <g stroke="url(#rgb)"
     stroke-width="2"
     stroke-opacity="0.45"
     filter="url(#glow)">

    <line x1="600" y1="400" x2="600" y2="175"/>
    <line x1="540" y1="420" x2="290" y2="300"/>
    <line x1="540" y1="465" x2="285" y2="575"/>
    <line x1="660" y1="420" x2="910" y2="300"/>
    <line x1="660" y1="465" x2="915" y2="575"/>
    <line x1="600" y1="520" x2="600" y2="690"/>

  </g>

  <!-- CENTER -->
  <circle cx="600" cy="450"
          r="115"
          fill="#8B5CF6"
          opacity="0.08"
          filter="url(#glow)"/>

  <circle cx="600" cy="450"
          r="92"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="3"
          filter="url(#shadow)"/>

  <text x="600" y="428"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#94A3B8">
    DEVELOPER
  </text>

  <text x="600" y="462"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="700"
        fill="#F8FAFC">
    CORE
  </text>

  <text x="600" y="488"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#00E5FF">
    THINK • BUILD • IMPROVE
  </text>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="420" y="140"
          width="360" height="78"
          rx="16"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="2"/>
  </g>

  <text x="600" y="173"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#00E5FF">
    🧠 PRINCIPLE 01
  </text>

  <text x="600" y="202"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    Problem Solving
  </text>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="70" y="255"
          width="330" height="82"
          rx="16"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="2"/>
  </g>

  <text x="235" y="289"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#60A5FA">
    🏗️ PRINCIPLE 02
  </text>

  <text x="235" y="318"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    Architecture
  </text>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="75" y="535"
          width="330" height="82"
          rx="16"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="2"/>
  </g>

  <text x="240" y="569"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#A78BFA">
    🧩 PRINCIPLE 03
  </text>

  <text x="240" y="598"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    Modularity
  </text>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="800" y="255"
          width="330" height="82"
          rx="16"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="2"/>
  </g>

  <text x="965" y="289"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#F472B6">
    🛡️ PRINCIPLE 04
  </text>

  <text x="965" y="318"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    Reliability
  </text>

  <!-- Card 5 -->
  <g filter="url(#shadow)">
    <rect x="795" y="535"
          width="330" height="82"
          rx="16"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="2"/>
  </g>

  <text x="960" y="569"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#F472B6">
    ♻️ PRINCIPLE 05
  </text>

  <text x="960" y="598"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    Reusability
  </text>

  <!-- Card 6 -->
  <g filter="url(#shadow)">
    <rect x="420" y="650"
          width="360" height="78"
          rx="16"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="2"/>
  </g>

  <text x="600" y="683"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#00F5A0">
    📈 PRINCIPLE 06
  </text>

  <text x="600" y="712"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    Scalability
  </text>

  <!-- Card 7 -->
  <g filter="url(#shadow)">
    <rect x="805" y="140"
          width="325" height="78"
          rx="16"
          fill="url(#card)"
          stroke="url(#rgb)"
          stroke-width="2"/>
  </g>

  <text x="967" y="173"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#60A5FA">
    📖 PRINCIPLE 07
  </text>

  <text x="967" y="202"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    Readability
  </text>

</svg>
