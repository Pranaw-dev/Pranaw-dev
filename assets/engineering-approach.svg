
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 850"
     width="100%"
     role="img">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="50%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#14091C"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172338"/>
      <stop offset="100%" stop-color="#0A0F19"/>
    </linearGradient>

    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="28%" stop-color="#3B82F6"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="14"
                    flood-color="#000000" flood-opacity="0.6"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1000" height="850" rx="30" fill="url(#bg)"/>

  <!-- Ambient lights -->
  <circle cx="120" cy="120" r="150"
          fill="#00E5FF" opacity="0.06"
          filter="url(#glow)"/>

  <circle cx="880" cy="730" r="160"
          fill="#EC4899" opacity="0.06"
          filter="url(#glow)"/>

  <!-- Heading -->
  <text x="500" y="60"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31"
        font-weight="700"
        fill="#F8FAFC">
    ENGINEERING APPROACH
  </text>

  <text x="500" y="90"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#94A3B8">
    Analyze → Design → Build → Validate → Scale
  </text>

  <rect x="245" y="112"
        width="510" height="3"
        rx="2"
        fill="url(#rgb)"
        filter="url(#glow)"/>

  <!-- STEP 1 -->
  <rect x="230" y="150"
        width="540" height="100"
        rx="20"
        fill="#000000"
        opacity="0.6"
        transform="translate(0 10)"/>

  <rect x="230" y="150"
        width="540" height="100"
        rx="20"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="230" y="150"
        width="8" height="100"
        rx="4"
        fill="#00E5FF"
        filter="url(#glow)"/>

  <text x="500" y="183"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#00E5FF">
    01
  </text>

  <text x="500" y="218"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#F8FAFC">
    🧩 Problem Analysis
  </text>

  <!-- Connector -->
  <line x1="500" y1="252"
        x2="500" y2="285"
        stroke="url(#rgb)"
        stroke-width="4"
        filter="url(#glow)"/>

  <polygon points="500,300 489,282 511,282"
           fill="#8B5CF6"/>

  <!-- STEP 2 -->
  <rect x="230" y="310"
        width="540" height="100"
        rx="20"
        fill="#000000"
        opacity="0.6"
        transform="translate(0 10)"/>

  <rect x="230" y="310"
        width="540" height="100"
        rx="20"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="230" y="310"
        width="8" height="100"
        rx="4"
        fill="#3B82F6"
        filter="url(#glow)"/>

  <text x="500" y="343"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#60A5FA">
    02
  </text>

  <text x="500" y="378"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#F8FAFC">
    🏗️ System / Design
  </text>

  <line x1="500" y1="412"
        x2="500" y2="445"
        stroke="url(#rgb)"
        stroke-width="4"
        filter="url(#glow)"/>

  <polygon points="500,460 489,442 511,442"
           fill="#8B5CF6"/>

  <!-- STEP 3 -->
  <rect x="230" y="470"
        width="540" height="100"
        rx="20"
        fill="#000000"
        opacity="0.6"
        transform="translate(0 10)"/>

  <rect x="230" y="470"
        width="540" height="100"
        rx="20"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="230" y="470"
        width="8" height="100"
        rx="4"
        fill="#8B5CF6"
        filter="url(#glow)"/>

  <text x="500" y="503"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#A78BFA">
    03
  </text>

  <text x="500" y="538"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#F8FAFC">
    ⚙️ Modular Code
  </text>

  <line x1="500" y1="572"
        x2="500" y2="605"
        stroke="url(#rgb)"
        stroke-width="4"
        filter="url(#glow)"/>

  <polygon points="500,620 489,602 511,602"
           fill="#EC4899"/>

  <!-- STEP 4 -->
  <rect x="230" y="630"
        width="540" height="100"
        rx="20"
        fill="#000000"
        opacity="0.6"
        transform="translate(0 10)"/>

  <rect x="230" y="630"
        width="540" height="100"
        rx="20"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="230" y="630"
        width="8" height="100"
        rx="4"
        fill="#EC4899"
        filter="url(#glow)"/>

  <text x="500" y="663"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#F472B6">
    04
  </text>

  <text x="500" y="698"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        fill="#F8FAFC">
    🧪 Validation &amp; Testing
  </text>

  <line x1="500" y1="732"
        x2="500" y2="765"
        stroke="url(#rgb)"
        stroke-width="4"
        filter="url(#glow)"/>

  <polygon points="500,780 489,762 511,762"
           fill="#00E5FF"/>

  <!-- STEP 5 -->
  <rect x="230" y="790"
        width="540" height="45"
        rx="15"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"/>

  <text x="500" y="820"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        fill="#F8FAFC">
    📈 Maintainability &amp; Scale
  </text>

</svg>
