<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 650"
     width="100%"
     role="img">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="50%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#14091C"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18243A"/>
      <stop offset="100%" stop-color="#0A0F19"/>
    </linearGradient>

    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="14"
                    flood-color="#000000" flood-opacity="0.6"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1000" height="650"
        rx="30"
        fill="url(#bg)"/>

  <!-- Ambient -->
  <circle cx="120" cy="120" r="150"
          fill="#00E5FF"
          opacity="0.05"
          filter="url(#glow)"/>

  <circle cx="880" cy="500" r="160"
          fill="#EC4899"
          opacity="0.05"
          filter="url(#glow)"/>

  <!-- Header -->
  <text x="500" y="60"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#F8FAFC">
    IRCTC TICKET BOOKING ARCHITECTURE
  </text>

  <text x="500" y="90"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#94A3B8">
    Layered Architecture • Separation of Concerns
  </text>

  <rect x="270" y="110"
        width="460"
        height="3"
        rx="2"
        fill="url(#rgb)"
        filter="url(#glow)"/>

  <!-- Controller -->
  <rect x="230" y="145"
        width="540" height="110"
        rx="20"
        fill="#000000"
        opacity="0.6"
        transform="translate(0 10)"/>

  <rect x="230" y="145"
        width="540" height="110"
        rx="20"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="230" y="145"
        width="8" height="110"
        rx="4"
        fill="#00E5FF"
        filter="url(#glow)"/>

  <text x="500" y="177"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#00E5FF">
    LAYER 01
  </text>

  <text x="500" y="215"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="700"
        fill="#F8FAFC">
    🎮 CONTROLLER
  </text>

  <text x="500" y="240"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#94A3B8">
    User interaction and request handling
  </text>

  <!-- Arrow -->
  <line x1="500" y1="260"
        x2="500" y2="300"
        stroke="url(#rgb)"
        stroke-width="4"
        filter="url(#glow)"/>

  <polygon points="500,315 488,295 512,295"
           fill="#8B5CF6"/>

  <!-- Service -->
  <rect x="230" y="325"
        width="540" height="110"
        rx="20"
        fill="#000000"
        opacity="0.6"
        transform="translate(0 10)"/>

  <rect x="230" y="325"
        width="540" height="110"
        rx="20"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="230" y="325"
        width="8" height="110"
        rx="4"
        fill="#8B5CF6"
        filter="url(#glow)"/>

  <text x="500" y="357"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#A78BFA">
    LAYER 02
  </text>

  <text x="500" y="395"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="700"
        fill="#F8FAFC">
    ⚙️ SERVICE
  </text>

  <text x="500" y="420"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#94A3B8">
    Business logic and application rules
  </text>

  <!-- Arrow -->
  <line x1="500" y1="440"
        x2="500" y2="480"
        stroke="url(#rgb)"
        stroke-width="4"
        filter="url(#glow)"/>

  <polygon points="500,495 488,475 512,475"
           fill="#EC4899"/>

  <!-- Repository -->
  <rect x="230" y="505"
        width="540" height="110"
        rx="20"
        fill="#000000"
        opacity="0.6"
        transform="translate(0 10)"/>

  <rect x="230" y="505"
        width="540" height="110"
        rx="20"
        fill="url(#card)"
        stroke="url(#rgb)"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="230" y="505"
        width="8" height="110"
        rx="4"
        fill="#EC4899"
        filter="url(#glow)"/>

  <text x="500" y="537"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        fill="#F472B6">
    LAYER 03
  </text>

  <text x="500" y="575"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="700"
        fill="#F8FAFC">
    🗄️ REPOSITORY
  </text>

  <text x="500" y="600"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#94A3B8">
    Data management and persistence
  </text>

</svg>
